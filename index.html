<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandigarh University</title>
<h1>my website</h1>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg, #0f172a, #2563eb);
        overflow:hidden;
    }

    .card{
        background:rgba(255,255,255,0.12);
        backdrop-filter:blur(12px);
        padding:50px 70px;
        border-radius:20px;
        text-align:center;
        color:white;
        box-shadow:0 15px 35px rgba(0,0,0,0.25);
        border:1px solid rgba(255,255,255,0.2);
    }

    .card h1{
        font-size:3rem;
        margin-bottom:15px;
        letter-spacing:2px;
    }

    .card p{
        font-size:1.1rem;
        opacity:0.9;
    }

    .glow{
        color:#ffd700;
        text-shadow:
            0 0 10px #ffd700,
            0 0 20px #ffd700,
            0 0 30px #ffcc00;
    }
</style>
</head>
<body>

<div class="card">
    <h1 class="glow">Chandigarh University</h1>
    <p>Excellence • Innovation • Global Learning</p>
</div>

</body>
</html>
